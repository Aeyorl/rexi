services:
  rexi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rexi-mainnet
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NETWORK_MODE=mainnet
      - RH_MAINNET_RPC_URL=https://robinhood-mainnet.g.alchemy.com/v2/HMKXQ2KwDrFO0nwFthZm0
      - RH_MAINNET_CHAIN_ID=4663
      - REXI_LAUNCHPAD_MAINNET=0x011a50Bd4Ac29c90513728da693E69cAB678111e
      - REXI_MAINNET_START_BLOCK=65314300
